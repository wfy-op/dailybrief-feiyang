name: Daily Brief Cloud

# The primary run is 08:07 Asia/Shanghai. The 10:07 and 14:07 runs are
# idempotent catch-ups: if today's dated HTML already exists on gh-pages they
# stop before fetching sources or calling a model.
on:
  schedule:
    - cron: '7 0,2,6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: daily-brief-cloud
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve report date
        id: date
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
        run: echo "date=$(TZ="$REPORT_TZ" date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore published archive
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            rm -f daily_reports/index.html daily_reports/archive.html
          fi

      - name: Restore academic freshness state
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin daily-state >/dev/null 2>&1; then
            git fetch origin daily-state:refs/remotes/origin/daily-state --depth=1
            git show origin/daily-state:academic-seen.json > data/academic-seen.json
          fi

      - name: Check idempotency guard
        id: current
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
        run: |
          if [ -s "daily_reports/$REPORT_DATE/$REPORT_DATE.html" ]; then
            echo "already-current=true" >> "$GITHUB_OUTPUT"
            echo "Published archive already contains $REPORT_DATE; catch-up is a no-op."
          else
            echo "already-current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate report
        if: steps.current.outputs.already-current != 'true'
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4o-mini' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          REPORT_LOCALE: zh
          REPORT_TZ: Asia/Shanghai
          WEB_MODE: 'true'
        run: |
          set -euo pipefail
          if [ "$LLM_BACKEND" = "openai" ] && [ -z "$OPENAI_API_KEY" ]; then
            export OPENAI_API_KEY="$GITHUB_MODELS_TOKEN"
            export OPENAI_BASE_URL="${OPENAI_BASE_URL:-https://models.github.ai/inference}"
          fi
          npm run daily

      - name: Validate private report
        if: steps.current.outputs.already-current != 'true'
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
          REPORT_LOCALE: zh
        run: npm run validate:publish -- --date "$REPORT_DATE" --stage report

      - name: Build public allowlist
        if: steps.current.outputs.already-current != 'true'
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
        run: npm run build-site -- --date "$REPORT_DATE"

      - name: Validate public site
        if: steps.current.outputs.already-current != 'true'
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
          REPORT_LOCALE: zh
        run: npm run validate:publish -- --date "$REPORT_DATE" --stage site

      - name: Publish to GitHub Pages branch
        if: steps.current.outputs.already-current != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-dist
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'daily: ${{ steps.date.outputs.date }}'

      - name: Prepare academic freshness state
        if: steps.current.outputs.already-current != 'true'
        run: |
          mkdir -p state-dist
          cp data/academic-seen.json state-dist/academic-seen.json

      - name: Persist academic freshness state
        if: steps.current.outputs.already-current != 'true'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./state-dist
          publish_branch: daily-state
          keep_files: false
          commit_message: 'state: ${{ steps.date.outputs.date }}'
